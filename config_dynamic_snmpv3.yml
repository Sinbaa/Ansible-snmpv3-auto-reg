
---
- name: Konfigurer SNMPv3 på nettverksswitcher
  hosts: switches
  gather_facts: false

  vars_files:
    - vault.yml

  tasks:
    - name: Konfigurer Cisco IOS
      ansible.builtin.include_tasks: tasks/cisco_ios.yml
      when: ansible_network_os == "cisco.ios.ios"

    - name: Konfigurer Juniper Junos
      ansible.builtin.include_tasks: tasks/juniper_junos.yml
      when: ansible_network_os == "junipernetworks.junos.junos"

    - name: Avvis ukjent nettverksoperativsystem
      ansible.builtin.fail:
        msg: >-
          Ikke støttet nettverksoperativsystem:
          {{ ansible_network_os }}
      when: ansible_network_os not in [
        "cisco.ios.ios",
        "junipernetworks.junos.junos"
      ]
