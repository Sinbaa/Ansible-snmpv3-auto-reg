---
- name: Registrer switch med ICMP i Zabbix
  community.zabbix.zabbix_host:
    http_login_user: "Admin"
    http_login_password: "{{ zabbix_api_token }}"
    host_name: "{{ inventory_hostname }}"
    host_groups:
      - "Network Devices"
    link_templates:
      - "{{ zabbix_template }}"
    interfaces:
      - type: 1
        main: 1
        useip: 1
        ip: "{{ ansible_host }}"
        dns: ""
        port: "10050"
    state: present
  delegate_to: localhost
  environment:
    ZABBIX_SERVER: "http://192.168.40.10/zabbix"
  no_log: true
