---
- name: Registrer switch med ICMP i Zabbix
  community.zabbix.zabbix_host:
    host_name: "{{ inventory_hostname }}"
    host_groups:
      - "{{ zabbix_host_group }}"
    link_templates:
      - "{{ zabbix_template }}"
    interfaces:
      - type: 1
        main: 1
        useip: 1
        ip: "{{ ansible_host }}"
        dns: ""
        port: "10050"
    state: present
  delegate_to: zabbix-api
  no_log: true
